<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>주문 관리 | 버거리 메뉴 투표</title>
  <style>
    :root { --ink:#222; --muted:#6b7280; --line:#e5e7eb; --accent:#e8590c; --bg:#f8f5f0; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 system-ui,-apple-system,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif; }
    main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
    h1 { font-size:22px; margin:0 0 4px; }
    h2 { font-size:17px; margin:0 0 12px; }
    .sub { color:var(--muted); margin:0 0 18px; font-size:13px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .row.between { justify-content:space-between; }
    button { font:inherit; border:1px solid var(--line); background:#fff; padding:9px 14px; border-radius:10px; cursor:pointer; font-weight:700; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button.danger { color:#b91c1c; border-color:#fecaca; }
    button:disabled { opacity:.5; cursor:default; }
    input { font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:10px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; font-size:12px; }
    td.num, th.num { text-align:right; white-space:nowrap; }
    tfoot td { font-weight:800; border-bottom:0; }
    .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:800; }
    .badge.open { background:#dcfce7; color:#166534; }
    .badge.closed { background:#fee2e2; color:#991b1b; }
    textarea { width:100%; min-height:220px; font:13px/1.6 ui-monospace,Consolas,monospace; padding:10px; border:1px solid var(--line); border-radius:10px; resize:vertical; }
    .msg { color:var(--muted); font-size:13px; min-height:20px; }
    .empty { color:var(--muted); padding:8px 0; }
  </style>
</head>
<body>
<main>
  <h1>주문 관리</h1>
  <p class="sub" id="date-label"></p>

  <div class="card" id="login-card">
    <h2>관리자 로그인</h2>
    <form class="row" id="login-form">
      <input type="password" id="admin-key" placeholder="관리자 비밀번호" autocomplete="current-password" required>
      <button class="primary" type="submit">확인</button>
    </form>
    <p class="msg" id="login-msg"></p>
  </div>

  <div id="panel" hidden>
    <div class="card row between">
      <div>투표 상태 <span class="badge open" id="status-badge">진행 중</span><div class="msg" id="count-label"></div></div>
      <div class="row">
        <button id="toggle-close" class="primary" type="button">투표 마감</button>
        <button id="reset" class="danger" type="button">초기화</button>
      </div>
    </div>

    <div class="card">
      <h2>메뉴별 수량</h2>
      <div id="summary"></div>
    </div>

    <div class="card">
      <h2>사이드 · 음료 수량 (세트)</h2>
      <div id="extras"></div>
    </div>

    <div class="card">
      <h2>이름별 주문</h2>
      <div id="people"></div>
    </div>

    <div class="card">
      <div class="row between"><h2>주문서 텍스트</h2><button id="copy" type="button">복사</button></div>
      <textarea id="order-text" readonly></textarea>
      <p class="msg" id="copy-msg"></p>
    </div>
  </div>
</main>
<script src="/admin.js"></script>
</body>
</html>
